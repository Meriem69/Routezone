name: Tests RouteZone

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: routezone
          POSTGRES_PASSWORD: routezone_pwd_2024
          POSTGRES_DB: routezone
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Import data into PostgreSQL
        env:
          DATABASE_URL: postgresql://routezone:routezone_pwd_2024@localhost:5432/routezone
        run: python bdd/import_data.py
      
      - name: Run pytest
        env:
          DATABASE_URL: postgresql://routezone:routezone_pwd_2024@localhost:5432/routezone
        run: pytest tests/ -v --tb=short