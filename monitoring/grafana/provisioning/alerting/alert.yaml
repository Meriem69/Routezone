apiVersion: 1
groups:
    - orgId: 1
      name: routezone-5m
      folder: RouteZone
      interval: 1m
      rules:
        - uid: afp8uyl64l9mof
          title: RouteZone - Latence p95 elevee
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: bfpe7lsyrxlvka
              model:
                editorMode: code
                expr: histogram_quantile(0.95, sum(rate(routezone_prediction_duration_seconds_bucket[5m])) by (le))
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.05
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            summary: Latence p95 des predictions au-dessus de 500 ms sur 5 minutes.
          labels:
            severity: warning
          isPaused: false
        - uid: ffp8z5jaqwgzka
          title: RouteZone - API down
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: bfpe7lsyrxlvka
              model:
                editorMode: code
                expr: up{job="routezone_api"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            summary: L'API RouteZone ne repond plus (cible Prometheus down).
          labels:
            severity: critical
          isPaused: false
        - uid: efp8zkwn65ce8e
          title: RouteZone - Taux d'erreur eleve
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: bfpe7lsyrxlvka
              model:
                editorMode: code
                expr: sum(rate(routezone_errors_total[5m])) / sum(rate(routezone_predictions_total[5m]))
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.5
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 5m
          annotations:
            summary: Taux d'erreur de l'API au-dessus de 5% sur 5 minutes.
          labels:
            severity: critical
          isPaused: false
        - uid: dfp8zvo88gq2oe
          title: RouteZone - Derive du modele
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: bfpe7lsyrxlvka
              model:
                editorMode: code
                expr: sum(rate(routezone_predictions_par_classe_total{label="Grave"}[1h])) / sum(rate(routezone_predictions_total[1h]))
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0.15
                            - 0.45
                        type: outside_range_included
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 10m
          annotations:
            summary: Proportion de predictions GRAVE sortie de sa bande normale (derive possible du modele).
          labels:
            severity: warning
          isPaused: false

